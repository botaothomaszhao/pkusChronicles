<!doctype html><div class="lake-content" typography="classic"><p id="u3e377484" class="ne-p"><span class="ne-text">暑假，校园主干道东侧的开放空间被改造为绿地，有两条小路和一个池塘，水池一头还有瀑布景观。</span></p><p id="u6a19c9fa" class="ne-p"><span class="ne-text">池塘被学生们根据校长马玉国的名字命名为“雨果池”，具体来源不可考，但随后两年内被全校师生接受用于日常称呼。园子有“领军园”（来自新版培养目标）、“雨果园”等多种叫法，但没有像“雨果池”那样广泛流行。</span></p><p id="ucb70729f" class="ne-p"><span class="ne-text">施工照片：</span></p><p id="uc0c6dd9b" class="ne-p"><figure class="image-figure"><img src="/img/1783999246983-ea53f125-6f82-4711-bf3e-cbbac5da76f8.jpeg" width="4096" crop="0,0,1,1" id="u0053f887" class="ne-image"><figcaption>摄于8.15，23届毕业生供图</figcaption></figure><figure class="image-figure"><img src="/img/1783999485756-2dbbb5fa-6835-43d1-9ba0-96bb0dc3f687.jpeg" width="8192" crop="0,0,1,1" id="u5a6576a5" class="ne-image"><figcaption>摄于8.27，23届毕业生供图，下同</figcaption></figure></p><p id="u1fd3a058" class="ne-p"><img src="/img/1783999491462-25e65221-5e35-48f1-b91d-a5509d783b10.jpeg" width="8192" title="" crop="0,0,1,1" id="ud3a1ae0b" class="ne-image"><img src="/img/1783999497522-94f7890c-2812-4d63-a992-b4e5c96558f2.jpeg" width="8192" title="" crop="0,0,1,1" id="u7ec16b49" class="ne-image"></p></div>
