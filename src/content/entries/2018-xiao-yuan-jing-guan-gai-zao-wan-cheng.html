<!doctype html><div class="lake-content" typography="classic"><p id="u1e96f16a" class="ne-p"><span class="ne-text">2018年3月，改造工程开始设计，7月开始施工，9月完成。</span></p><p id="ubc3c7880" class="ne-p"><span class="ne-text">改造中，校园中间的机动车道被取消，改为人行道；封闭篮球场改为开放的下沉篮球场；草坪改为露天场地。整个校园中部区域由分隔的不同区域变成一个融合的整体。体育馆前的消防通道也改为跑廊，且增加了宣传栏功能。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></span></p><p id="u7b9703a8" class="ne-p"><span class="ne-text"></span></p><p id="u62522c87" class="ne-p"><span class="ne-text">宣传栏何时贴满了社团介绍待考。</span></p><p id="ud21b1739" class="ne-p"><br></p><p id="ubaf4a7cd" class="ne-p"><img src="/1783654481399-880fec3a-c406-45e9-a7f1-3c93397ed844.jpeg" width="1400" title="" crop="0,0,1,1" id="ucbe4f986" class="ne-image"><img src="/1783654502847-392d7de9-28d4-4e2f-93eb-3f98c451227d.jpeg" width="1400" title="" crop="0,0,1,1" id="ucf21f91f" class="ne-image"></p><p id="u211a10cc" class="ne-p"><br></p><p id="u08d66da7" class="ne-p"><span class="ne-text">本次改造后形成了如下校园地图：</span></p><p id="u86a82668" class="ne-p"><img src="/1760018522481-e5e446a6-d97a-4dbf-874e-1c6b89951910.jpeg" width="726" title="" crop="0,0,1,1" id="tWNOY" class="ne-image"></p><p id="u0ba9c52c" class="ne-p"><br></p><ol class="footnotes-list">
