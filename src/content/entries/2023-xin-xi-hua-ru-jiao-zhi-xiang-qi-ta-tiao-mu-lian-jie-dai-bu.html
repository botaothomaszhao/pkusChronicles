<!doctype html><div class="lake-content" typography="classic"><p id="uf875b5d5" class="ne-p"><span class="ne-text">应有相关条目：26届新生入教</span></p><p id="ufd231b7c" class="ne-p"><span class="ne-text">SubIT社团连续第x年向新生进行信息化入教，包括在致慧礼堂向全年级的宣讲和在图书馆等场地分别向各个书院进行入教培训。</span></p><p id="ua6a383e8" class="ne-p"><span class="ne-text"></span></p><p id="ue7d31278" class="ne-p"><span class="ne-text">主要内容：</span></p><p id="u3c04fe13" class="ne-p"><span class="ne-text">学校平板的使用和制度规范；</span></p><p id="uc455fad5" class="ne-p"><span class="ne-text">校内信息化平台使用，包括：希悦、语雀、ClassIn、O365（三件套、邮箱、Onedrive、Forms）</span></p><p id="u783690bc" class="ne-p"><span class="ne-text">根据与25届信息化入教内容（应为条目链接）对比，本次未提及O365中的Yammer（aka Viva Engage by微软改名部）校园论坛。</span></p></div>
