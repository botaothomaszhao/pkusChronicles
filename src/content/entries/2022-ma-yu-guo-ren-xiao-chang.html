<!doctype html><div class="lake-content" typography="classic"><p id="u098e6807" class="ne-p"><span class="ne-text">2022年3月15日，马玉国被任命为北大附中党委副书记、校长。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup>这结束了持续3个月的北大附中无校长“惯性运行”时期。</span></p><p id="u2d2010c7" class="ne-p"><span class="ne-text" style="color: rgb(51, 51, 51); font-size: 14px"></span></p><p id="u29dd0927" class="ne-p"><span class="ne-text">马玉国，男，汉族，1972年2月生，中共党员，教授，博士生导师。</span></p><p id="ucb9ed4bb" class="ne-p"><span class="ne-text">现任北京大学副教务长、</span><span class="ne-text">北京大学附属中学</span><span class="ne-text">党委副书记、校长；北京大学分析测试中心主任，北京大学软物质科学与工程中心副主任。中国科协第九次代表大会代表，</span><span class="ne-text">中国化学会</span><span class="ne-text">理事。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup></span></p><p id="u1bc216bc" class="ne-p"><span class="ne-text"></span></p><p id="u77e7640e" class="ne-p"><img src="/1782207855768-a803f60b-2bfd-40e2-bb42-75b1507fb5a6.jpeg" width="432.5" title="" crop="0,0,1,1" id="u4a4796b3" class="ne-image"></p><p id="u921a41fb" class="ne-p"><br></p><ol class="footnotes-list">
