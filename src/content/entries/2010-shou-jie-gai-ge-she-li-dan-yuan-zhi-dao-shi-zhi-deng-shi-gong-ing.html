<!doctype html><div class="lake-content" typography="classic"><p id="u8034dc5a" class="ne-p"><span class="ne-text">一系列改革措施推行，包括设立单元制：将高一高二分为六个不同的单元。一、二、三单元为理科常规单元，单元色为分别为橙、黄、绿；四单元为文科单元，单元色为青色；五单元为竞赛单元，单元色为蓝色；六单元为出国自主单元，单元色为紫色。 　</span></p><p id="u949a81a0" class="ne-p"><span class="ne-text">设立导师制，取消班主任，实行走课制，取消各种如要求穿校服之类的规定。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></span></p><p id="ud476007a" class="ne-p"><span class="ne-text">成立道尔顿学院（出国方向）。<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup><br /></span></p><ol class="footnotes-list">
