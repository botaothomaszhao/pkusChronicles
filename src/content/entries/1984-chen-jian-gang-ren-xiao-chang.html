<!doctype html><div class="lake-content" typography="classic"><p id="u6b8a9d3c" class="ne-p"><span class="ne-text">陈剑刚老师，数学特级教师。1958年毕业于复旦大学数学系，同年任北京大学数学力学系助教。1960年任北大附数学教师，曾任数学教研组长，教务主任，副校长，校长等职。 1986年被北京市政府授予特级教师。[^1]</span></p><p id="u985cde65" class="ne-p"><span class="ne-text"></span></p><p id="u1a9406eb" class="ne-p"><img src="https://cdn.nlark.com/yuque/0/2026/png/38713584/1782210127731-17df2d1d-46c7-49d1-aab5-f5ffcf2581b2.png" width="326" title="" crop="0,0,1,1" id="u5b092902" class="ne-image"></p><p id="u2ef063a4" class="ne-p"><br></p><p id="u2a606668" class="ne-p"><span class="ne-text">[^1]: </span><a href="https://edu.sina.com.cn/y/news/2005-08-10/204041362.html" data-href="https://edu.sina.com.cn/y/news/2005-08-10/204041362.html" target="_blank" class="ne-link"><span class="ne-text">https://edu.sina.com.cn/y/news/2005-08-10/204041362.html</span></a></p></div>
