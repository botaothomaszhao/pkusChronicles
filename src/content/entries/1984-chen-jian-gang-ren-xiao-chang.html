<!doctype html><div class="lake-content" typography="classic"><p id="u6b8a9d3c" class="ne-p"><span class="ne-text">陈剑刚老师，数学特级教师。1958年毕业于复旦大学数学系，同年任北京大学数学力学系助教。1960年任北大附数学教师，曾任数学教研组长，教务主任，副校长，校长等职。 1986年被北京市政府授予特级教师。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></span></p><p id="u985cde65" class="ne-p"><span id="itbeO" class="ne-bookmark-inline"><a href="https://mp.weixin.qq.com/s/dFe76m2dNkcBzzQZ2rOYcQ" target="_blank">附中人物｜不忘初心，方得始终——原北大附中校长陈剑刚</a></span></p><p id="u1a9406eb" class="ne-p"><img src="/img/1782210127731-17df2d1d-46c7-49d1-aab5-f5ffcf2581b2.png" width="326" title="" crop="0,0,1,1" id="u5b092902" class="ne-image"></p><p id="u4c187c57" class="ne-p"><br></p><ol class="footnotes-list">
