<!doctype html><div class="lake-content" typography="classic"><p id="u050b7331" class="ne-p"><span class="ne-text">学校首次向高中部全体学生免费发放平板。此前校内信息化事务需要由学生自带设备（电脑或平板）。</span></p><p id="u9e71c733" class="ne-p"><span class="ne-text">主要政策和26届相似，待25/24届同学来再补充。</span></p><p id="uc72a565b" class="ne-p"><span class="ne-text"></span></p><p id="uefd77175" class="ne-p"><span class="ne-text">以下转述自25届同学记录：</span></p><p id="u5d737233" class="ne-p"><span class="ne-text">刚发放平板时易控强制开启定位回传（自动将平板定位上传学校服务器），学校称是用于丢失后找回。</span></p><p id="u5642c243" class="ne-p"><span class="ne-text">学生因担忧个人隐私安全，联名上书学校，后来取消了定位强制回传，改为可在易控设置选项中自愿开启。（时间等详细信息待25届学生补充）自愿开启定位回传的政策截至2026春季学期（该条目撰写时间）未改变。</span></p><p id="u7ee8e03f" class="ne-p"><span class="ne-text"></span></p><p id="u21321c8a" class="ne-p"><span class="ne-text">25届信息化入教介绍了Yammer的使用，但实际使用逐渐减少，至下一学年彻底被弃用。</span></p></div>
