<!doctype html><div class="lake-content" typography="classic"><p id="u010175a7" class="ne-p"><span class="ne-text">校园东墙因有安全隐患被拆除。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></span></p><p id="uf55e6ba7" class="ne-p"><img src="/img/1787115687872-d9eb74fb-1587-4a97-9da6-7fa21ed0f6d6.jpeg" width="1440" title="" crop="0,0,1,1" id="u44c3a3d7" class="ne-image"><img src="/img/1787115688813-09609b05-579c-4035-89ad-f8bba115be93.jpeg" width="1440" title="" crop="0,0,1,1" id="u35a4b70f" class="ne-image"><img src="/img/1787115688644-90060dc0-17b5-471b-a087-85983f8b6300.jpeg" width="1440" title="" crop="0,0,1,1" id="uedfddd67" class="ne-image"><img src="/img/1787115688115-b4316254-b9ff-48cb-8702-b55fb87cf96b.jpeg" width="1440" title="" crop="0,0,1,1" id="u472b37a6" class="ne-image"><img src="/img/1787115688403-b49a96bf-fe2e-40ed-9df6-1539cc1a1e44.jpeg" width="1440" title="" crop="0,0,1,1" id="uf273cf49" class="ne-image"><img src="/img/1787115689476-9a0d719d-e842-4762-bd4e-7e22f96dd6fb.jpeg" width="1440" title="" crop="0,0,1,1" id="u0c1bdfdb" class="ne-image"><img src="/img/1787115689727-478f0eae-3248-4022-923b-83db36bac948.jpeg" width="1440" title="" crop="0,0,1,1" id="u483420d7" class="ne-image"><img src="/img/1787115689650-2bbaf74b-ff5d-4330-ae07-df46c0df902a.jpeg" width="1080" title="" crop="0,0,1,1" id="uee1b7972" class="ne-image"><img src="/img/1787115689928-41004133-4314-45b9-903c-f4da51824689.jpeg" width="1440" title="" crop="0,0,1,1" id="uaebd038d" class="ne-image"></p><p id="ua1efa328" class="ne-p"><br></p><p id="u7133b78c" class="ne-p"><span class="ne-text">东墙原有大量涂鸦，其中包含2008奥运主题涂鸦，多为2010届学生绘制。也有相近年份的报纸拼贴。</span></p><p id="uc33ddc86" class="ne-p"><span class="ne-text">历史照片（待补）：</span></p><p id="u60edc0ae" class="ne-p"><figure class="image-figure"><img src="/img/1787115885529-4fecded8-42ee-4e06-9762-f16454120db6.png" width="270" crop="0,0,1,1" id="udda39e87" class="ne-image"><figcaption>这是2010届二班在北京举办奥运会的那年，在校园东围墙上画的宣传画。那一年，全校很多班级都在东围墙留下了本班的印迹。</figcaption></figure></p><p id="ud2ef8758" class="ne-p"><figure class="image-figure"><img src="/img/1787116178073-47f81679-8f82-4b4f-bdde-eacabe857c2b.png" width="450" crop="0,0,1,1" id="u3a8e762c" class="ne-image"><figcaption>照片的拍摄位置是站在如今通往空中操场的坡道下，面向体育馆方向看到的情景——这是曾经的大操场。在当年大操场的尽头，画面最远处有一排矮墙，隐约能看到墙面五颜六色。那就是“奥运”墙。</figcaption></figure></p><p id="u737e2018" class="ne-p"><span class="ne-text">上2图来自2026毕业活动<sup class="fn-ref"><a href="#fn-2" id="fnref-2">2</a></sup>。</span></p><p id="ufc13b0c8" class="ne-p"><span class="ne-text"></span></p><ol class="footnotes-list">
