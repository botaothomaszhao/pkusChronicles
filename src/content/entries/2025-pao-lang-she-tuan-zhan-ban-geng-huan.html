<!doctype html><div class="lake-content" typography="classic"><p id="ua11a10bd" class="ne-p"><span class="ne-text">9月26日，跑廊南半边的宣传海报，即科技和艺术社团海报，全部被撕。北边体育俱乐部未动。</span></p><p id="ue452f77b" class="ne-p"><span class="ne-text">10月9日有工人贴上了科学教育中心的新宣传栏。</span></p><p id="u5e9c5958" class="ne-p"><br></p><p id="ua9b9f6ae" class="ne-p"><span class="ne-text">被撕后：</span></p><p id="u47a3e569" class="ne-p"><figure class="image-figure"><img src="/img/1758882123044-bb804bd2-3153-4d78-866f-4d4e1f5d3529.jpeg" width="2880" crop="0,0,1,1" id="ufba3c998" class="ne-image"><figcaption>26届学生供图，下同</figcaption></figure></p><p id="u5039ed2b" class="ne-p"><br></p><p id="ue1064ff1" class="ne-p"><span class="ne-text">10月9日粘贴过程中：</span></p><p id="u3c71e14e" class="ne-p"><img src="/img/1759979375497-b91234f8-1ce0-4aa9-8dee-ebba31c148f4.jpeg" width="4128" title="" crop="0,0,1,1" id="u7f23220d" class="ne-image"><img src="/img/1759979398414-64497e54-5ad0-40ca-9ed9-5037a1b30d39.jpeg" width="4128" title="" crop="0,0,1,1" id="u9a66cc9d" class="ne-image"></p><p id="u0d9337d7" class="ne-p"><br></p><p id="ue50d5fb2" class="ne-p"><span class="ne-text">新宣传海报：</span></p><p id="uffd04594" class="ne-p"><img src="/img/1760164155158-555f17ed-f4c5-4c20-8682-c70f6969f04e.jpeg" width="4128" title="" crop="0,0,1,1" id="u2d3be792" class="ne-image"><img src="/img/1760164175947-cd51ae31-5756-4b41-8f14-599da1b4f05a.jpeg" width="4128" title="" crop="0,0,1,1" id="u721aca79" class="ne-image"><img src="/img/1760164175461-96f5adb2-6eac-49c8-89f7-faa1391e8977.jpeg" width="4128" title="" crop="0,0,1,1" id="u56d1ac4b" class="ne-image"><img src="/img/1760164175687-944d88f5-cd77-4a14-bbae-e8f8f3795aaf.jpeg" width="4128" title="" crop="0,0,1,1" id="u0c269e40" class="ne-image"><figure class="image-figure"><img src="/img/1760164176314-6f4699c6-aea6-404a-82fd-6ec41b7dcd1e.jpeg" width="3096" crop="0,0,1,1" id="ue5ec51d6" class="ne-image"><figcaption>这页海报是有错的</figcaption></figure></p><p id="u64c97cc3" class="ne-p"><span class="ne-text"></span></p><p id="ud7486d04" class="ne-p"><span class="ne-text">10月20日，有半页被重贴，据路过老师说是写错了：</span></p><p id="u07c21f14" class="ne-p"><figure class="image-figure"><img src="/img/1760936110243-e5f4fc9e-a289-4199-8cff-da9dd966b881.jpeg" width="2160" crop="0,0,1,1" id="uc8721744" class="ne-image"><figcaption>这是更正的</figcaption></figure></p><p id="u94100e2d" class="ne-p"><br></p></div>
