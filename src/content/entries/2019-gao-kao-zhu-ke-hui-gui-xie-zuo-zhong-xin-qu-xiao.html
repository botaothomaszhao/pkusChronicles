<!doctype html><div class="lake-content" typography="classic"><p id="uba001378" class="ne-p"><span class="ne-text">暑假，学校宣布，九门高考科目统⼀回归，由行知学院负责，使用国家统一教材。写作课和博雅下属的阅读课全部取消，只保留了一部分李韧的创意写作，作为选修。</span></p><p id="u454f5920" class="ne-p"><span class="ne-text">秋季新学期开学，新生不再拥有对主课的选择权，大部分课表是排好的，九门高考科目不再选课、走班，而是排课、固定班级。</span></p><p id="u09e873a7" class="ne-p"><span class="ne-text">原博雅课程，如创意写作，被划分为“研究性学习”。<sup class="fn-ref"><a href="#fn-1" id="fnref-1">1</a></sup></span></p><p id="u8175985e" class="ne-p"><span class="ne-text"></span></p><ol class="footnotes-list">
